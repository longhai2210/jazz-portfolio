version: '3.8'

services:
  # Database Service (for local development or self-hosting on EC2)
  postgres:
    image: postgres:16-alpine
    container_name: jazz-postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-jazz_db}
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Backend API Service
  api:
    build:
      context: ../../
      dockerfile: infra/docker/api.Dockerfile
    container_name: jazz-api
    restart: always
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-jazz_db}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-24h}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_CLOUDFRONT_DOMAIN=${AWS_CLOUDFRONT_DOMAIN}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      - postgres

volumes:
  pgdata:
