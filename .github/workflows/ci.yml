name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jazz-portfolio/database db:generate
      - run: pnpm turbo run lint type-check
      - run: pnpm turbo run build test
        env:
          # Build-time placeholders; runtime values come from Amplify / host env.
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
